services:
  postgres:
    image: postgres:15-alpine
    container_name: gamecatalog_postgres
    restart: always
    env_file:
      - .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - default

  app:
    build: .
    container_name: gamecatalog_app
    restart: always
    networks:
      - npm_network
      - default
      - grafana_network
    env_file:
      - .env
    ports:
      - "3000:3000"

volumes:
  pgdata:
    driver: local

networks:
  grafana_network:
    external: true
  npm_network:
    external: true
