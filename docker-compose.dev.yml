
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.development
    ports:
      - "3000:3000"
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    env_file:
      - .env.development
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${PGPORT}:5432"

  grafana:
    image: grafana/grafana:11.0.0
    env_file:
      - .env.development
    ports:
      - "3001:3000"
    networks:
      - grafana-network

volumes:
  postgres_data:

networks:
  grafana-network:
    driver: bridge
