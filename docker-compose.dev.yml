
services:
 
  postgres:
    image: postgres:15-alpine
    container_name: gamecatalog_postgres
    
    restart: always
    environment:
      - POSTGRES_DB=gamecatalog-db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=123postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - default
  redis:
      image: redis:alpine
      container_name: gamecatalog-redis
      ports:
        - "127.0.0.1:6379:6379"
      mem_limit: 128m
      mem_reservation: 64m
      healthcheck:
        test: ["CMD", "redis-cli", "ping"]
        interval: 5s
        timeout: 3s
        retries: 5
      # Limita memória para simular sua VPS de 1GB
      deploy:
        resources:
          limits:
            memory: 128M

volumes:
  pgdata:
    driver: local
    
networks:
  grafana-network:
    external: true