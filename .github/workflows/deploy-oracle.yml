name: "Deploy to Docker Hub and VPS"

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/gamecatalog:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Adicionado: Cria a pasta na VPS caso ela não exista
      - name: Ensure directory exists
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: mkdir -p ~/gamecatalog

      # Adicionado: Copia os 3 arquivos para dentro da pasta gamecatalog
      - name: Copy Infrastructure Files
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          source: "docker-compose.yml,docker-entrypoint.sh,grafana-compose.yml,local-config.yml"
          target: "~/gamecatalog"
          rm: false

      - name: Run remote SSH commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          sync: true 
          debug: true
          script: |
            mkdir -p ~/gamecatalog && cd ~/gamecatalog
            
            # 1. Permissão para o entrypoint
            chmod +x docker-entrypoint.sh
            
            # 2. Gerar o .env.prod de produção
            cat << 'EOF' > .env.prod
            ${{ toJSON(secrets) }}
            EOF
            sed -i 's/[{}"]//g; s/: /=/g; s/,$//g; /^$/d' .env.prod
            sed -i '/^SSH_KEY=/d; /^HOST=/d; /^USERNAME=/d; /^DOCKERHUB_/d' .env.prod

            # 3. Docker Deploy
            docker network create grafana_network || true
            docker network create npm_network || true
            
            # Puxa a imagem nova do Docker Hub e recria os containers
            docker compose pull
            docker compose up -d
            
            # Limpeza de imagens antigas/órfãs para economizar disco na VPS
            docker image prune -f