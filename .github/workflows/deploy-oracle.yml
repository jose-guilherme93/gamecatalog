name: "Deploy to VPS"

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    env:
      #postgres
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      PGPORT: ${{ secrets.PGPORT }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

      #ssh
      HOST: ${{ secrets.HOST }}
      USERNAME: ${{ secrets.USERNAME }}
      SSH_KEY: ${{ secrets.SSH_KEY }}

      #grafana
      GF_SECURITY_ADMIN_USER: ${{ secrets.GF_SECURITY_ADMIN_USER }}
      GF_SECURITY_ADMIN_PASSWORD: ${{ secrets.GF_SECURITY_ADMIN_PASSWORD }}

      #abacatepay
      ABACATE_PAY_API: ${{ secrets.ABACATE_PAY_API }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "24.11"

      - name: Test SSH access
        uses: appleboy/ssh-action@v1
        with:
          port: 22
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            whoami
            pwd
            mkdir ~/test-frontend-temp
            echo "Test folder created. Now removing it..."
            rm -rf ~/test-frontend-temp
            echo "Test folder removed."

      - name: Copy files via SCP
        uses: appleboy/scp-action@v1
        with:
          port: 22
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          source: "."
          target: "gamecatalog"

      - name: Run remote SSH commands
        uses: appleboy/ssh-action@v1
        with:
          port: 22
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ~/gamecatalog

            echo "Gerando .env com todas variáveis disponíveis..."
            printenv | grep -vE '^(HOME|PATH|PWD|SHLVL|_|SHELL|USER|LOGNAME|LANG|SSH_CLIENT|SSH_CONNECTION|XDG.*|DBUS.*)' > .env

            echo "Conteúdo do .env:"
            cat .env

            docker compose down
            docker compose up -d --build
